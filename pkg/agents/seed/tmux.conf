# tmux config for a terminal tab. Read straight out of /seed (tmux -f), so it is
# always the version the extension last wrote and there is no copy in the tree.
#
# Mouse on so the scroll wheel scrolls tmux's 50k-line scrollback (it enters
# copy-mode automatically and exits at the bottom). A plain mouse drag selects
# via tmux copy-mode; when the drag ends, set-clipboard emits the selection as
# an OSC 52 sequence, which the terminal component hands to the browser
# clipboard - so drag-select auto-copies. (Shift+drag still does a native
# xterm.js selection.) The terminal-features line tells tmux the outer terminal
# understands OSC 52.
set -g mouse on
set -g history-limit 50000

# Pass focus in and out of the pane through to what is running in it. claude
# asks for this by name on startup when it is off, and asking is the thing this
# pod is trying not to do.
set -g focus-events on
set -s set-clipboard on
set -as terminal-features ',xterm-256color:clipboard'

# No status bar. The harness keeps tmux's, where it lists the windows of a
# session you can switch between; this pane has one session and one window, so
# it would be a row of screen spent on a constant - and a green one, which is
# the only thing in the pane that cannot follow Rancher's theme.
set -g status off
